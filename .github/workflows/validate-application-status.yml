name: Validate application status

on:
  pull_request:
    paths:
      - 'applications/**/APPLICATION.json'
      - 'applications/**/APPLICATION_STATUS.json'
      - 'applications/STATUS.json'
      - 'scripts/update_application_status.py'
      - '.github/workflows/validate-application-status.yml'
  push:
    branches:
      - main
    paths:
      - 'applications/**/APPLICATION.json'
      - 'applications/**/APPLICATION_STATUS.json'
      - 'applications/STATUS.json'
      - 'scripts/update_application_status.py'
      - '.github/workflows/validate-application-status.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate application status records and master index
        run: python scripts/update_application_status.py --check
