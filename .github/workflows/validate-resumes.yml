name: Validate rebuilt resumes

on:
  workflow_call:
    inputs:
      rebuilt_manifest:
        description: 'JSON manifest emitted by the immediately preceding artifact build'
        required: true
        type: string
      artifact_commit:
        description: 'Exact source-and-artifact commit produced by the generation job'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact generated-artifact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_commit }}
          fetch-depth: 0

      - name: Verify main still points to the artifact commit
        shell: bash
        run: |
          git fetch origin main
          current="$(git rev-parse origin/main)"
          expected="${{ inputs.artifact_commit }}"
          if [[ "$current" != "$expected" ]]; then
            echo "main advanced from artifact commit $expected to $current before validation."
            echo "Refusing to validate or commit reports for a stale artifact set."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Restore exact rebuilt-artifact manifest
        env:
          REBUILT_MANIFEST: ${{ inputs.rebuilt_manifest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ['REBUILT_MANIFEST'])
          Path('/tmp/rebuilt.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Validate only rebuilt resumes
        run: python scripts/validate_rebuilt_artifacts.py --manifest /tmp/rebuilt.json

      - name: Commit validation reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generic/validation applications
          if git diff --cached --quiet; then
            echo 'No validation changes to commit.'
          else
            git fetch origin main
            current="$(git rev-parse origin/main)"
            expected="${{ inputs.artifact_commit }}"
            if [[ "$current" != "$expected" ]]; then
              echo "main advanced from artifact commit $expected to $current during validation."
              echo "Refusing to rebase stale validation output onto newer work."
              exit 1
            fi
            git commit -m 'Validate rebuilt resume artifacts'
            git push origin HEAD:main
          fi
